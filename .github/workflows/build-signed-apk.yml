name: Build signed APK

# Cloud build: GitHub Actions. Runs on a free GitHub runner (no local JDK/SDK needed).
# Trigger manually from the "Actions" tab, or automatically on push to main.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APKs (unsigned)
        run: ./gradlew assembleStandardRelease

      - name: Prepare keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Sign every APK
        run: |
          mkdir -p out
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for f in app/build/outputs/apk/standard/release/*-unsigned.apk; do
            base=$(basename "$f" -unsigned.apk)
            "$APKSIGNER" sign \
              --ks release.jks \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --out "out/$base.apk" "$f"
          done
          rm -f release.jks
          ls -lh out

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: out/*.apk
          if-no-files-found: error
